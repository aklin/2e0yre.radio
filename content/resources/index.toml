## Resources
A list of radio-related resources that I use. This is mostly for my own use.

* **[Amateur Radio Ham Radio Maidenhead Grid Square Locator Map][levine]** -
  A reverse Maidenhead locator.
* **[whatsmylocator.com][wml]** - Maidenhead locator on a map.
* **[waveshed.io][rem]** - Radio Environment Map
* **https://rssvalidator.com/** - RSS and Atom feed validator
* **[Topographic map][topo]** - United Kingdom topographic map

[wml]: https://www.whatsmylocator.co.uk/
[levine]: https://www.levinecentral.com/ham/grid_square.php
[rem]: https://waveshed.io/
[topo]: https://en-gb.topographic-map.com/map-cgt/United-Kingdom/?center=51.27223%2C-0.06986&zoom=9
"""
